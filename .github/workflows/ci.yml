name: MediQR Secure CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 12.8.1
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint all packages
        run: pnpm turbo run lint

      - name: Typecheck all packages (Strict TS)
        run: pnpm turbo run typecheck

      - name: Run Unit Tests
        run: pnpm turbo run test

      - name: Run Cerbos policy tests
        run: docker run --rm -v "$PWD/infra/cerbos/policies:/policies:ro" ghcr.io/cerbos/cerbos:0.42.0 compile /policies

      - name: Build Monorepo (Turborepo)
        run: pnpm turbo run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_NAME: mediqr_test
      DB_USER: mediqr_test
      DB_PORT: "5432"
      DB_SSL_ENABLED: "false"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      STORAGE_ENDPOINT: 127.0.0.1
      STORAGE_PORT: "9000"
      STORAGE_USE_SSL: "false"
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      KEYCLOAK_BASE_URL: http://127.0.0.1:8080
      KEYCLOAK_REALM: mediqr
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: integration@mediqr.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 12.8.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'REDIS_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'STORAGE_ACCESS_KEY=%s\n' "$(openssl rand -hex 10)" >> "$GITHUB_ENV"
          printf 'STORAGE_SECRET_KEY=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'KEYCLOAK_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          for key in SESSION_SECRET AUDIT_HMAC_KEY MASTER_ENCRYPTION_KEY KMS_MASTER_KEY JWT_ACCESS_SECRET JWT_REFRESH_SECRET HMAC_QR_SIGNING_KEY OTP_HMAC_SECRET; do
            printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          done

      - name: Start integration service containers
        run: docker compose up --wait -d postgres redis minio clamav mailpit keycloak cerbos

      - name: Apply database migrations and seed fake user
        run: pnpm db:setup

      - name: Wait for Keycloak realm
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/realms/mediqr/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak realm did not become ready" >&2
          exit 1

      - name: Wait for ClamAV to accept scans
        run: |
          for i in {1..60}; do
            if printf 'zPING\0' | timeout 3 bash -c 'cat < /dev/tcp/127.0.0.1/3310' | grep -q PONG; then
              exit 0
            fi
            sleep 5
          done
          echo "ClamAV did not become ready" >&2
          exit 1

      - name: Run integration tests against service containers
        run: pnpm test:int

  browser-auth-e2e:
    name: Browser Authentication E2E
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_NAME: mediqr_test
      DB_USER: mediqr_test
      DB_PORT: "5432"
      DB_SSL_ENABLED: "false"
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      STORAGE_ENDPOINT: 127.0.0.1
      STORAGE_PORT: "9000"
      STORAGE_USE_SSL: "false"
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: "3310"
      KEYCLOAK_BASE_URL: http://localhost:8080
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_REALM: mediqr
      KEYCLOAK_CLIENT_ID: mediqr-web
      WEB_BASE_URL: http://localhost:3000
      API_INTERNAL_URL: http://127.0.0.1:3001
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      MAIL_FROM_ADDRESS: integration@mediqr.invalid
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 12.8.1
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          printf 'DB_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'REDIS_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'STORAGE_ACCESS_KEY=%s\n' "$(openssl rand -hex 10)" >> "$GITHUB_ENV"
          printf 'STORAGE_SECRET_KEY=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          printf 'KEYCLOAK_ADMIN_PASSWORD=%s\n' "$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          for key in SESSION_SECRET AUDIT_HMAC_KEY MASTER_ENCRYPTION_KEY KMS_MASTER_KEY JWT_ACCESS_SECRET JWT_REFRESH_SECRET HMAC_QR_SIGNING_KEY OTP_HMAC_SECRET; do
            printf '%s=%s\n' "$key" "$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          done

      - name: Start test service containers
        run: docker compose up --wait -d postgres redis minio minio-init minio-init-quarantine clamav mailpit keycloak cerbos

      - name: Apply migrations and seed fake development data
        run: pnpm db:setup

      - name: Wait for imported Keycloak realm
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8080/realms/mediqr/.well-known/openid-configuration > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "Keycloak realm did not become ready" >&2
          exit 1

      - name: Install Chromium for Playwright
        run: pnpm --filter @mediqr/web exec playwright install --with-deps chromium

      - name: Run browser authentication tests
        run: pnpm test:e2e

      - name: Upload patient consent flow screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase-3-consent-flow-screenshots
          path: apps/web/test-results/**/consent-flow-*.png
          if-no-files-found: warn

  security-scans:
    name: Security Scanners (Gitleaks, Semgrep, Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # 1. Gitleaks - Secret Detection
      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Semgrep - Static Application Security Testing (SAST)
      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/owasp-top-ten
            p/typescript

      # 3. Trivy - Filesystem & Misconfiguration Scanner
      - name: Run Trivy Vulnerability & Config Scanner
        uses: aquasecurity/trivy-action@c03d123cb480c08c69b054af418ea5e69fe6e57e # release commit
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"
